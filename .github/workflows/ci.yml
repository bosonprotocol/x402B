name: CI

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt JS-action runtimes onto Node 24 ahead of GitHub's June 2026 forced
# migration so checkout/setup-node/etc. don't print Node-20 deprecation
# warnings on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-test-lint:
    name: build / test / lint (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm format:check

  # Runs the @p0 + @p1 subset of the x402-e2e scenario suite against the
  # real Docker stack. Always-on per PR. Cold image pulls + stack boot
  # take 2–5 minutes. The `operational.test.ts` file is excluded: its F1
  # chaos scenario kills the facilitator container mid-flight and would
  # race the chain-touching tests in other files when run in parallel.
  # Keeping it out lets this job stay parallel (fast); the operational
  # tier — F1 (@p1), plus F2 / F4 (@p2) — is exercised nightly via the
  # `test:chaos` script (runs operational.test.ts alone, sequentially).
  # The @p2 tier is also kept out here via the tag filter.
  e2e-pr:
    name: e2e (@p0 + @p1)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The browser-paywall scenarios (test/browser/paywall.test.ts) drive a
      # headless Chromium via Playwright. `pnpm install` fetches the npm
      # package but not the browser binary, so install it (+ system libs)
      # explicitly. Only Chromium is used, so skip the other engines.
      - name: Install Playwright Chromium
        run: pnpm --filter @bosonprotocol/x402-e2e exec playwright install --with-deps chromium

      - name: Run @p0 + @p1 e2e suite
        env:
          E2E_DOCKER: "1"
        # Uses the `test:pr` script (rather than `test -- -t '@p0|@p1'`)
        # because pnpm v10 forwards the `--` separator literally and vitest
        # then parses the flags as positional file patterns instead of the
        # `--testNamePattern` / `--exclude` options. The script pins the
        # `@p0|@p1` tag filter and excludes `operational.test.ts` so the
        # job stays parallel-safe (no chaos tests).
        run: pnpm --filter @bosonprotocol/x402-e2e test:pr

      - name: Dump docker compose logs on failure
        if: failure()
        run: |
          cd typescript/packages/x402-e2e
          docker compose -f src/stack/compose.yaml logs --no-color > docker-compose.log || true

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-pr-logs-${{ github.run_id }}
          path: typescript/packages/x402-e2e/docker-compose.log
          if-no-files-found: ignore
