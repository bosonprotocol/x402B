name: Nightly e2e

# Runs the full x402-e2e scenario suite against the real Docker stack on
# a daily schedule, in two phases that share one stack:
#   1. the parallel suite — everything EXCEPT the chaos file, and
#   2. the chaos/operational file (F1 facilitator restart, F2 subgraph
#      lag, F4 buyer key rotation) on its own, sequentially.
# The per-PR `e2e-pr` job in `ci.yml` runs only @p0+@p1 and also excludes
# the chaos file, so the operational scenarios are exercised here.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  # Manual `workflow_dispatch` should not cancel a scheduled run in
  # progress (and vice versa). Each is a deliberate request.
  cancel-in-progress: false

# Mirrors ci.yml: opt JS-action runtimes onto Node 24 ahead of
# GitHub's June 2026 forced migration so deprecation warnings stay
# off the log.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e-full:
    name: e2e (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The browser-paywall scenarios (test/browser/paywall.test.ts) drive a
      # headless Chromium via Playwright. `pnpm install` fetches the npm
      # package but not the browser binary, so install it (+ system libs)
      # explicitly. Only Chromium is used, so skip the other engines.
      - name: Install Playwright Chromium
        run: pnpm --filter @bosonprotocol/x402-e2e exec playwright install --with-deps chromium

      # Two-phase run sharing one stack. `E2E_DOCKER_KEEP_STACK=1` makes
      # globalSetup skip its post-suite teardown, so phase 2 reuses the
      # exact containers phase 1 brought up — no restart in between.
      #
      # Phase 1: the full suite MINUS the chaos file, in parallel (fast;
      # the suite is parallel-safe via per-file seed-wallet slots).
      - name: Run parallel e2e suite (excludes chaos tests)
        env:
          E2E_DOCKER: "1"
          E2E_DOCKER_KEEP_STACK: "1"
        run: pnpm --filter @bosonprotocol/x402-e2e test

      # Phase 2: only operational.test.ts, sequentially. Its F1 SIGKILLs
      # the facilitator and F2 pauses the subgraph, so it must run with no
      # other test file racing the killed/paused containers.
      - name: Run chaos/operational tests sequentially (reuses stack)
        env:
          E2E_DOCKER: "1"
          E2E_DOCKER_KEEP_STACK: "1"
        run: pnpm --filter @bosonprotocol/x402-e2e test:chaos

      - name: Dump docker compose logs on failure
        if: failure()
        run: |
          cd typescript/packages/x402-e2e
          docker compose -f src/stack/compose.yaml logs --no-color > docker-compose.log || true

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-logs-${{ github.run_id }}
          path: typescript/packages/x402-e2e/docker-compose.log
          if-no-files-found: ignore

      # E2E_DOCKER_KEEP_STACK=1 disabled globalSetup's auto-teardown so the
      # two phases could share the stack — tear it down explicitly now.
      - name: Tear down stack
        if: always()
        run: pnpm --filter @bosonprotocol/x402-e2e stack:down
